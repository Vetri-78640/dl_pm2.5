[project]
name = "dl-pm25"
version = "2.0.0"
description = "Phase 2: controlled backbone study for 16-hour PM2.5 forecasting over India (Team T024)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "statsmodels",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["dryrun: synthetic-data dry runs of the Kaggle notebooks (slow; run with -m dryrun)"]
addopts = "-m 'not dryrun'"
